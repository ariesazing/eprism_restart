services:
  app:
    build:
      context: .
      args:
        VITE_APP_NAME: ${APP_NAME:-ePrism Research Workflow}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-eprism-local-key}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-eprism}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      REDIS_HOST: redis
      REVERB_HOST: app
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      ONLYOFFICE_URL: http://localhost:8082
      ONLYOFFICE_CALLBACK_BASE_URL: http://host.docker.internal:8000
      QPDF_BINARY: /usr/bin/qpdf
      PDFTOTEXT_BINARY: /usr/bin/pdftotext
    ports:
      - "8000:80"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage/app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eprism_restartDB}
      MYSQL_USER: ${DB_USERNAME:-eprism}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_HEADER: Authorization
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

volumes:
  app_storage:
  mysql_data:
  redis_data:
  onlyoffice_data:
  onlyoffice_logs:
